# Local dev ClickHouse. Schema in ../deploy/schema is applied on first start.
#   docker compose -f dev/docker-compose.yaml up -d
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # native
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ../deploy/schema:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
volumes:
  clickhouse-data:
