[package]
name = "ekokube-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8"
base64 = "0.22"
clickhouse.workspace = true
ekokube-common = { path = "../common" }
k8s-openapi = { version = "0.25", features = ["latest"] }
kube = { version = "1", default-features = false, features = ["client", "rustls-tls"] }
# kube's rustls-tls doesn't pull a crypto provider; install one explicitly at
# startup (see main.rs) so the kube client can build its TLS config.
rustls = { version = "0.23", features = ["ring"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
