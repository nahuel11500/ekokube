name: release-please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Parses conventional commits on main, maintains a release PR that bumps
      # versions (Cargo.toml, Chart.yaml, image tags via x-release-please
      # markers) + CHANGELOG. Merging that PR tags vX.Y.Z, which triggers the
      # release workflow to publish matching images.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
