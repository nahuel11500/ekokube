{{- if and .Values.server.auth.enabled (not .Values.server.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-server-auth
  namespace: {{ .Release.Namespace }}
stringData:
  password: {{ required "server.auth.password is required when auth is enabled (or set existingSecret)" .Values.server.auth.password | quote }}
{{- end }}
